<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SS Family 관심기업 분석</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/industry.css" />
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
    a { color: var(--color-accent-700); }
    a:hover { color: var(--color-accent-900); }
    .k-card:hover { background: var(--color-accent-100); }
    .k-star:hover { transform: scale(1.15); }
    .k-seg:hover:not(.active) { background: var(--color-accent-100); }

    @media (max-width: 1100px) {
      .k-hero { grid-template-columns: 1fr !important; }
      .k-stats { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .k-cards { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
      .k-alerts { grid-template-columns: 1fr !important; }
    }
    @media (max-width: 640px) {
      .k-cards { grid-template-columns: 1fr !important; }
      .k-header-right span:first-child { display: none; }
    }
  </style>
</head>

<body>
  <div style="min-height:100vh;background:var(--color-bg);background-image:linear-gradient(var(--color-neutral-200) 1px,transparent 1px),linear-gradient(90deg,var(--color-neutral-200) 1px,transparent 1px);background-size:68px 68px;">

    <header style="position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:var(--space-6);padding:var(--space-4) var(--space-8);background:var(--color-bg);border-bottom:1px solid var(--color-divider);">
      <div style="display:flex;align-items:center;gap:var(--space-4);">
        <div style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-weight:600;font-size:15px;">SS</div>
        <div style="display:flex;flex-direction:column;">
          <span style="font-family:var(--font-heading);font-weight:600;font-size:19px;line-height:1.05;">SS Family</span>
          <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);">SSFAMILY · 8 STOCK ANALYSIS</span>
        </div>
      </div>
      <div class="k-header-right" style="display:flex;align-items:center;gap:var(--space-3);">
        <span id="dateChip" style="font-family:var(--font-heading);font-size:13px;letter-spacing:0.12em;text-transform:uppercase;padding:var(--space-2) var(--space-3);border:1px solid var(--color-divider);color:var(--color-accent-700);"></span>
        <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:var(--space-2) var(--space-3);border:1px solid var(--color-divider);">★ <span id="favCount">0</span></span>
      </div>
    </header>

    <main style="max-width:1240px;margin:0 auto;padding:var(--space-8) var(--space-8) 72px;">

      <section class="k-hero" style="display:grid;grid-template-columns:1fr 380px;gap:var(--space-8);align-items:end;margin-bottom:var(--space-8);">
        <div>
          <div style="font-family:var(--font-heading);font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:var(--space-2);">Coverage · 8 issues</div>
          <h1 style="margin:0;font-size:52px;letter-spacing:-0.02em;">8개 관심기업 분석 보드</h1>
        </div>
        <p style="margin:0;font-size:12.5px;line-height:1.6;color:var(--color-neutral-700);">직접 선정해 상시 추적하는 8개 종목만 다룹니다. 현재가·등락률·시가총액을 한 판에 놓고 비교하며, 각 종목 상세 페이지로 이어집니다. 재무 데이터는 OpenDART 공시 원문, 시세는 Yahoo Finance 기준입니다. 투자 권고가 아닙니다.</p>
      </section>

      <section class="k-stats" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-6);margin-bottom:var(--space-8);" id="statGrid"></section>

      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-6);">
        <div style="display:flex;align-items:baseline;gap:var(--space-3);">
          <h2 style="margin:0;font-size:24px;">종목 카드</h2>
          <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);">정렬 기준</span>
        </div>
        <div style="display:flex;border:1px solid var(--color-divider);" id="sortToolbar"></div>
      </div>

      <section class="k-cards" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-6);margin-bottom:48px;" id="cardGrid"></section>

      <section style="margin-bottom:48px;">
        <div style="display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-6);">
          <h2 style="margin:0;font-size:24px;">지표 비교</h2>
          <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);">Spec sheet</span>
        </div>
        <div class="blueprint">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="overflow-x:auto;">
            <div id="compareTable"></div>
          </div>
        </div>
      </section>

      <section id="alertSection"></section>
    </main>

    <footer style="padding:var(--space-6) var(--space-8);border-top:1px solid var(--color-divider);font-size:12px;letter-spacing:0.08em;color:var(--color-neutral-600);text-align:center;">© 2026 SS FAMILY. ALL RIGHTS RESERVED.</footer>
  </div>

  <script>
    const dailyMovers = [
      { name: "에이블씨엔씨", code: "078520", industry: "생활·화장품", close: "12,280원", change: 7.25, page: "stocks/007_078520.html" },
      { name: "한화", code: "000880", industry: "지주·복합기업", close: "118,100원", change: 6.59, page: "stocks/005_000880.html" }
    ];

    const stockLive = {
      "005930": { price: 257000, change: 0 },
      "105560": { price: 166400, change: 2.02 },
      "055550": { price: 106500, change: 3.1 },
      "000270": { price: 134900, change: 2.59 },
      "000880": { price: 118100, change: 6.59 },
      "001340": { price: 5070, change: 1.6 },
      "078520": { price: 12280, change: 7.25 },
      "097230": { price: 17010, change: 1.19 }
    };

    const latestUpdateDate = "2026-08-25";

    const stocks = [
      { "rank": 1, "name": "삼성전자", "code": "005930", "industry": "반도체·전자", "slug": "samsung-electronics", "page": "stocks/001_005930.html", "sharesOut": 5846278608, "logo": "005930-samsung-electronics.webp" },
      { "rank": 2, "name": "KB금융", "code": "105560", "industry": "금융", "slug": "kb-financial", "page": "stocks/002_105560.html", "sharesOut": 354687734, "logo": "105560-kb-financial.jpg" },
      { "rank": 3, "name": "신한지주", "code": "055550", "industry": "금융", "slug": "shinhan-financial", "page": "stocks/003_055550.html", "sharesOut": 469450239, "logo": "055550-shinhan-financial.svg" },
      { "rank": 4, "name": "기아", "code": "000270", "industry": "자동차", "slug": "kia", "page": "stocks/004_000270.html", "sharesOut": 390412998, "logo": "000270-kia.webp" },
      { "rank": 5, "name": "한화", "code": "000880", "industry": "지주·복합기업", "slug": "hanwha", "page": "stocks/005_000880.html", "sharesOut": 70507919, "logo": "000880-hanwha.webp" },
      { "rank": 6, "name": "PKC", "code": "001340", "industry": "화학·소재", "slug": "pkc", "page": "stocks/006_001340.html", "sharesOut": 45028089, "logo": "001340-pkc.avif" },
      { "rank": 7, "name": "에이블씨엔씨", "code": "078520", "industry": "생활·화장품", "slug": "able-cnc", "page": "stocks/007_078520.html", "sharesOut": 26014161, "logo": "078520-able-cnc.jpg" },
      { "rank": 8, "name": "HJ중공업", "code": "097230", "industry": "조선·건설", "slug": "hj-heavy", "page": "stocks/008_097230.html", "sharesOut": 90295344, "logo": "097230-hj-heavy.png" }
    ];

    const UP = '#a8462c';
    const FAV_KEY = 'ssfamily.favorites';
    let favorites = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]'));
    let sortBy = 'mcap';

    function saveFavorites() {
      localStorage.setItem(FAV_KEY, JSON.stringify([...favorites]));
      document.getElementById('favCount').textContent = favorites.size;
    }
    function toggleFav(code) {
      favorites.has(code) ? favorites.delete(code) : favorites.add(code);
      saveFavorites();
      renderAll();
    }

    function won(n) { return n.toLocaleString('ko-KR') + '원'; }
    function pct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }
    function chColor(v) { return v > 0 ? UP : v < 0 ? 'var(--color-accent-700)' : 'var(--color-neutral-600)'; }
    function marketCapOf(stock) {
      const live = stockLive[stock.code];
      if (!live || !stock.sharesOut) return null;
      return (live.price * stock.sharesOut) / 1e12;
    }

    function sortedStocks() {
      return stocks.slice().sort((a, b) => {
        if (sortBy === 'change') return (stockLive[b.code] ? stockLive[b.code].change : -99) - (stockLive[a.code] ? stockLive[a.code].change : -99);
        if (sortBy === 'name') return a.name.localeCompare(b.name, 'ko');
        return (marketCapOf(b) || 0) - (marketCapOf(a) || 0);
      });
    }

    function renderStats(ordered) {
      const capSum = ordered.reduce((sum, s) => sum + (marketCapOf(s) || 0), 0);
      const changes = ordered.map((s) => stockLive[s.code] ? stockLive[s.code].change : null).filter((v) => v != null);
      const avgChange = changes.length ? changes.reduce((a, b) => a + b, 0) / changes.length : 0;
      const stats = [
        { label: '분석 종목', value: ordered.length, unit: '개', color: 'var(--color-text)' },
        { label: '합산 시가총액', value: capSum.toFixed(1), unit: '조원', color: 'var(--color-accent-800)' },
        { label: '평균 등락률', value: pct(avgChange), unit: '', color: chColor(avgChange) },
        { label: '5% 이상 변동', value: dailyMovers.length, unit: '개', color: dailyMovers.length ? UP : 'var(--color-text)' }
      ];
      document.getElementById('statGrid').innerHTML = stats.map((c) => `
        <div class="blueprint" style="padding:var(--space-4) var(--space-6);">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:var(--space-2);">${c.label}</div>
          <div style="font-family:var(--font-heading);font-size:36px;line-height:1;color:${c.color}">${c.value}<span style="font-size:14px;font-family:var(--font-body);font-weight:400;color:var(--color-neutral-600);"> ${c.unit}</span></div>
        </div>
      `).join('');
    }

    function renderSortToolbar() {
      const sorts = [['mcap', '시가총액'], ['change', '등락률'], ['name', '이름']];
      document.getElementById('sortToolbar').innerHTML = sorts.map(([id, label], i) => `
        <button type="button" class="k-seg ${sortBy === id ? 'active' : ''}" data-sort="${id}" style="border:0;${i < sorts.length - 1 ? 'border-right:1px solid var(--color-divider);' : ''}cursor:pointer;padding:var(--space-3) var(--space-4);font-family:var(--font-heading);font-weight:600;font-size:14px;letter-spacing:0.04em;background:${sortBy === id ? 'var(--color-accent)' : 'transparent'};color:${sortBy === id ? 'var(--color-bg)' : 'var(--color-text)'}">${label}</button>
      `).join('');
      document.querySelectorAll('#sortToolbar .k-seg').forEach((btn) => {
        btn.addEventListener('click', () => { sortBy = btn.dataset.sort; renderAll(); });
      });
    }

    function renderCards(ordered) {
      document.getElementById('cardGrid').innerHTML = ordered.map((s, i) => {
        const live = stockLive[s.code];
        const has = live && typeof live.change === 'number';
        const fav = favorites.has(s.code);
        const cap = marketCapOf(s);
        return `
        <div class="blueprint k-card" style="display:flex;flex-direction:column;gap:var(--space-4);padding:var(--space-4);transition:background .15s;">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-family:var(--font-heading);font-size:26px;line-height:1;color:var(--color-accent);">${String(i + 1).padStart(2, '0')}</span>
            <button type="button" class="k-star" data-code="${s.code}" style="border:0;background:none;cursor:pointer;font-size:17px;line-height:1;padding:2px;transition:transform .12s;color:${fav ? 'var(--color-accent)' : 'var(--color-neutral-400)'}">${fav ? '★' : '☆'}</button>
          </div>
          <div class="blueprint" style="position:relative;height:96px;display:flex;align-items:center;justify-content:center;padding:14px;">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <img src="images/logos/${s.logo}" alt="${s.name} 로고" style="max-width:100%;max-height:100%;object-fit:contain;" loading="lazy" />
          </div>
          <div>
            <a href="${s.page}" style="text-decoration:none;color:inherit;font-family:var(--font-heading);font-size:22px;line-height:1.1;display:block;">${s.name}</a>
            <div style="font-size:11px;letter-spacing:0.08em;color:var(--color-neutral-600);margin-top:2px;">${s.code} · ${s.industry}</div>
          </div>
          <div style="display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid var(--color-divider);padding-top:var(--space-3);">
            <span style="font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;">${live ? won(live.price) : '—'}</span>
            <span style="font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:${has ? chColor(live.change) : 'inherit'}">${has ? pct(live.change) : '—'}</span>
          </div>
          <div style="font-size:11px;letter-spacing:0.08em;color:var(--color-neutral-600);">시총 ${cap == null ? '—' : cap.toFixed(1) + '조원'}</div>
          <a href="${s.page}" class="btn btn-primary" style="border-radius:0;font-size:13px;letter-spacing:0.06em;">상세 분석</a>
        </div>`;
      }).join('');
      document.querySelectorAll('#cardGrid .k-star').forEach((btn) => {
        btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleFav(btn.dataset.code); });
      });
    }

    function renderCompareTable(ordered) {
      const n = ordered.length;
      const cols = `180px repeat(${n},minmax(110px,1fr))`;
      const headerCells = ordered.map((s) => `<div style="text-align:right;font-family:var(--font-heading);font-size:14px;letter-spacing:0.02em;color:var(--color-text);">${s.name}</div>`).join('');
      const rows = [
        { label: '현재가', cells: ordered.map((s) => { const l = stockLive[s.code]; return { text: l ? won(l.price) : '—', color: 'var(--color-text)' }; }) },
        { label: '전일 대비 등락률', cells: ordered.map((s) => { const l = stockLive[s.code]; const has = l && typeof l.change === 'number'; return { text: has ? pct(l.change) : '—', color: has ? chColor(l.change) : 'var(--color-text)' }; }) },
        { label: '시가총액', cells: ordered.map((s) => { const c = marketCapOf(s); return { text: c == null ? '—' : c.toFixed(1) + '조원', color: 'var(--color-text)' }; }) },
        { label: '발행주식수', cells: ordered.map((s) => ({ text: s.sharesOut ? (s.sharesOut / 1e6).toFixed(1) + '백만주' : '—', color: 'var(--color-neutral-700)' })) }
      ];
      const rowsHtml = rows.map((row) => `
        <div style="display:grid;grid-template-columns:${cols};align-items:center;padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--color-neutral-200);">
          <div style="font-size:12.5px;letter-spacing:0.04em;color:var(--color-neutral-700);">${row.label}</div>
          ${row.cells.map((c) => `<div style="text-align:right;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:${c.color}">${c.text}</div>`).join('')}
        </div>
      `).join('');
      document.getElementById('compareTable').innerHTML = `
        <div style="display:grid;grid-template-columns:${cols};align-items:center;padding:var(--space-3) var(--space-6);border-bottom:1px solid var(--color-divider);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-neutral-600);">
          <div>지표</div>
          ${headerCells}
        </div>
        ${rowsHtml}
      `;
    }

    function renderAlerts() {
      const section = document.getElementById('alertSection');
      if (dailyMovers.length === 0) {
        section.innerHTML = `<p style="margin:0;padding:var(--space-6);border:1px solid var(--color-divider);font-size:13px;color:var(--color-neutral-700);text-align:center;">오늘 8개 종목 중 전일 대비 5% 이상 변동한 종목은 없습니다.</p>`;
        return;
      }
      section.innerHTML = `
        <div style="display:flex;align-items:baseline;gap:var(--space-3);margin-bottom:var(--space-6);">
          <h2 style="margin:0;font-size:24px;">5% 이상 변동</h2>
          <span style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--color-neutral-600);">Daily market move</span>
        </div>
        <div class="k-alerts" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-6);">
          ${dailyMovers.map((a) => `
            <div class="blueprint" style="display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);padding:var(--space-4) var(--space-6);">
              <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
              <div>
                <div style="font-family:var(--font-heading);font-size:19px;line-height:1.1;">${a.name}</div>
                <div style="font-size:11px;letter-spacing:0.08em;color:var(--color-neutral-600);">${a.code} · ${a.industry}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:14px;font-variant-numeric:tabular-nums;">${a.close}</div>
                <div style="font-family:var(--font-heading);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;color:${chColor(a.change)}">${pct(a.change)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderDateChip() {
      const d = new Date(latestUpdateDate + 'T00:00:00+09:00');
      const text = `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} 종가`;
      document.getElementById('dateChip').textContent = text;
    }

    function renderAll() {
      const ordered = sortedStocks();
      renderStats(ordered);
      renderSortToolbar();
      renderCards(ordered);
      renderCompareTable(ordered);
      renderAlerts();
    }

    renderDateChip();
    saveFavorites();
    renderAll();
  </script>
</body>
</html>
